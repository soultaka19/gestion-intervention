<!-- Shell de l'application -->
<div class="flex h-screen bg-gray-50 overflow-hidden">

  <app-sidebar />
  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <app-navbar />

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-6">
      <div class="container-app">
        <!-- Page Header -->
        <div class="mb-6">
          <h2 class="text-2xl font-bold text-gray-900 mb-2">Tableau de bord</h2>
          <p class="text-gray-600">Vue d'ensemble de vos interventions et activités</p>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
          <!-- Card 1 -->
          <div class="card animate-fade-in">
            <div class="card-body">
              <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-medium text-gray-600">Interventions actives</span>
                <div class="w-10 h-10 bg-primary-100 rounded-lg flex items-center justify-center">
                  <svg class="w-5 h-5 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                  </svg>
                </div>
              </div>
              <div class="flex items-baseline gap-2">
                <h3 class="text-3xl font-bold text-gray-900">24</h3>
                <span class="text-sm text-green-600 font-medium">+12%</span>
              </div>
            </div>
          </div>

          <!-- Card 2 -->
          <div class="card animate-fade-in" style="animation-delay: 0.1s">
            <div class="card-body">
              <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-medium text-gray-600">Urgentes</span>
                <div class="w-10 h-10 bg-red-100 rounded-lg flex items-center justify-center">
                  <svg class="w-5 h-5 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                  </svg>
                </div>
              </div>
              <div class="flex items-baseline gap-2">
                <h3 class="text-3xl font-bold text-gray-900">8</h3>
                <span class="text-sm text-red-600 font-medium">+3</span>
              </div>
            </div>
          </div>

          <!-- Card 3 -->
          <div class="card animate-fade-in" style="animation-delay: 0.2s">
            <div class="card-body">
              <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-medium text-gray-600">Techniciens actifs</span>
                <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
                  <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                  </svg>
                </div>
              </div>
              <div class="flex items-baseline gap-2">
                <h3 class="text-3xl font-bold text-gray-900">16</h3>
                <span class="text-sm text-gray-500">/ 20</span>
              </div>
            </div>
          </div>

          <!-- Card 4 -->
          <div class="card animate-fade-in" style="animation-delay: 0.3s">
            <div class="card-body">
              <div class="flex items-center justify-between mb-2">
                <span class="text-sm font-medium text-gray-600">Taux de résolution</span>
                <div class="w-10 h-10 bg-secondary-100 rounded-lg flex items-center justify-center">
                  <svg class="w-5 h-5 text-secondary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                  </svg>
                </div>
              </div>
              <div class="flex items-baseline gap-2">
                <h3 class="text-3xl font-bold text-gray-900">94%</h3>
                <span class="text-sm text-green-600 font-medium">+2.5%</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Recent Interventions -->
        <div class="card">
          <div class="card-header flex items-center justify-between">
            <h3>Interventions récentes</h3>
            <button class="btn-ghost btn-sm">Voir tout</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
